<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Страница не найдена — Твоё Время</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#d8cbb0;font:16px/1.6 Georgia,serif;text-align:center}main{max-width:620px;padding:56px 36px;border:1px solid rgba(212,184,138,.24);background:radial-gradient(circle at 50% 0,rgba(212,184,138,.08),transparent 60%);border-radius:20px}p{margin:12px 0 28px;color:#bdb19c}a{display:inline-block;padding:12px 20px;border:1px solid #d4b88a;border-radius:999px;color:#ebe2cf;text-decoration:none}a:focus-visible{outline:2px solid #d4b88a;outline-offset:4px}.code{color:#d4b88a;font-size:13px;letter-spacing:.2em;text-transform:uppercase}h1{margin:8px 0 0;color:#ebe2cf;font-size:clamp(32px,8vw,54px);font-weight:500}
  </style>
</head>
<body>
  <main>
    <div class="code">Ошибка 404</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или был введён с ошибкой.</p>
    <a href="/">Вернуться на главную</a>
  </main>
</body>
</html>
